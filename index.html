<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Documentation</title>
    <!-- Switched to Cloudflare cdnjs to bypass network blocks -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        body { margin: 0; padding: 0; }
        #swagger-ui { min-height: 100vh; background: #fff; }
    </style>
</head>
<body>

    <div id="swagger-ui"></div>

    <!-- Switched JS to Cloudflare cdnjs -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        const ui = SwaggerUIBundle({
            url: './openapi.json',
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            layout: "BaseLayout"
        });
    </script>
</body>
</html>
